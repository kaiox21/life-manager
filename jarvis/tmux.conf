# tmux do Jarvis (socket `jarvis`): terminais compartilhados entre o Terminal.app e o Jarvis.
# Instalado pelo install_mac.sh em ~/Library/Application Support/Jarvis/tmux.conf.
# openspec/changes/jarvis-terminais-controle, design, decisão 2.

# Claude Code dentro do tmux (code.claude.com/docs/en/terminal-config, "Configure tmux"):
# Shift+Enter, notificações e barra de progresso
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Esc sem atraso (o Claude Code usa o Esc para interromper)
set -s escape-time 10
# Terminal.app e Jarvis com tamanhos diferentes: vale o último usado
set -g window-size latest
# rolar com o mouse; para selecionar texto nativo no Terminal.app, Option + arrastar
set -g mouse on
set -g history-limit 50000
# parecer um terminal comum
set -g status off
# Ctrl+B é do Claude Code (mandar tarefa para o fundo): prefixo em Ctrl+]
set -g prefix C-]
unbind C-b
bind C-] send-prefix
