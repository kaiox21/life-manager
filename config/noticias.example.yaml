# Perfil do boletim de notícias (copie para config/noticias.yaml e ajuste; config/noticias.yaml
# fica fora do git como o das vagas). Change boletim-noticias.

# temas das notícias gerais, na ordem de preferência; a descrição orienta a busca
temas:
  - chave: tecnologia
    nome: Tecnologia e IA
    descricao: inteligência artificial, big techs, lançamentos e regulação de tecnologia
  - chave: direito
    nome: Direito e Judiciário
    descricao: STF, STJ, CNJ, decisões e projetos de lei relevantes, tecnologia no Judiciário
  - chave: brasil
    nome: Brasil e política
    descricao: governo federal, Congresso, economia e Distrito Federal
  - chave: mundo
    nome: Mundo
    descricao: o fato internacional mais importante do dia

gerais: 5     # notícias gerais no boletim
futebol: 3    # notícias da seção de futebol

# times com prioridade na seção de futebol (resultado, próximo jogo, contratações)
times: [Flamengo, Barcelona]

# fontes aceitas: domínio (ou domínio/caminho) → nome mostrado. A busca fica restrita a esses
# domínios (subdomínios entram) e o nome da fonte sai daqui pelo link, não do texto do modelo. A
# entrada mais específica ganha. Sites que bloqueiam o robô da Anthropic não podem entrar (a
# busca recusa o pedido inteiro); conferido em 13/10/2026: BBC, Reuters, AP, NYT, Guardian,
# El País, DW, Wired, UOL, Estadão, The Verge, Ars Technica, Marca, AS, Mundo Deportivo e Sport.
fontes:
  # Brasil e política
  g1.globo.com: G1
  oglobo.globo.com: O Globo
  valor.globo.com: Valor
  folha.uol.com.br: Folha
  cnnbrasil.com.br: CNN Brasil
  agenciabrasil.ebc.com.br: Agência Brasil
  poder360.com.br: Poder360
  metropoles.com: Metrópoles
  correiobraziliense.com.br: Correio Braziliense
  nexojornal.com.br: Nexo
  # tecnologia e IA
  tecnoblog.net: Tecnoblog
  olhardigital.com.br: Olhar Digital
  canaltech.com.br: Canaltech
  techcrunch.com: TechCrunch
  technologyreview.com: MIT Technology Review
  engadget.com: Engadget
  # direito e Judiciário
  conjur.com.br: ConJur
  migalhas.com.br: Migalhas
