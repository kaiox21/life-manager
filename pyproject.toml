[project]
name = "life-manager"
version = "0.1.0"
description = "Assistente pessoal de agenda e gastos (WhatsApp + Jarvis)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1",
    "apscheduler>=3.10,<4",
    "av>=15,<17",
    "fastapi>=0.115",
    "faster-whisper>=1.2.1",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.61.0",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "openai>=3.26.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.30",
    "websockets>=15",
]

[project.optional-dependencies]
jarvis = [
    "mlx-whisper>=0.4.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "pyobjc-framework-avfoundation>=11 ; sys_platform == 'darwin'",
    "pysilero-vad>=3.4",
    "sounddevice>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-python-dateutil>=2.9.0.20260807",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "eval: prova contra o modelo real (custa dinheiro, precisa de AI_GATEWAY_API_KEY)",
    "whisper: transcrição real com faster-whisper (baixa o modelo; só no macOS, usa `say`)",
    "integracao: fala com o núcleo rodando no Docker (localhost:8000)",
]
addopts = "-m 'not eval and not whisper and not integracao'"

[tool.ruff.lint.per-file-ignores]
# Texto do prompt copiado do SPEC.md; quebrar as linhas mudaria o prompt.
"app/agent/prompt.py" = ["E501"]
"app/agent/intent.py" = ["E501"]
"jarvis/agent.py" = ["E501"]
