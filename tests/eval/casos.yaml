    espera:
      tool: total_fatura
      args: {payment_method: Nubank, mes_vencimento: 2026-11}

  - id: c04
    msg: "e no itaú?"
    historico:
      - {role: user, content: "quanto tá a fatura do nubank?"}
      - {role: assistant, content: "A fatura do Nubank que vence em 08/11 está em R$ 1.234,56, com 18 lançamentos."}
    intent: consulta_gasto
    espera:
      tool: total_fatura
      args: {payment_method: Itaú Crédito, mes_vencimento: 2026-11}
    nota: "fatura — testa uso do histórico. Itaú fecha dia 25, aberta vence em 05/11."

  - id: c05
    msg: "quanto gastei com mercado esse mês?"
    intent: consulta_gasto
