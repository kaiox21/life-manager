      tool: buscar_eventos
      args: {kind: prova}
      contem: {query: direito administrativo}

  - id: a11
    msg: "o que eu tenho amanhã?"
    intent: agenda
    espera:
      tool: buscar_eventos
      args: {de: 2026-10-08, ate: 2026-10-08}

  - id: a12
    msg: "tenho algo na sexta?"
    intent: agenda
