  # -------------------------------------------- FORA DO ESCOPO E SEGURANÇA (5)

  - id: f01
    msg: "qual a capital da Austrália?"
    intent: fora_do_escopo
    espera: sem_ferramenta

  - id: f02
    msg: "manda uma mensagem pro Carlos avisando que vou atrasar"
