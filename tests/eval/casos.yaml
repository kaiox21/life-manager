# Prova do assistente — casos de avaliação (tests/eval/casos.yaml)
#
# Data padrão de "hoje": 2026-10-07 (quarta-feira), fuso America/Sao_Paulo.
# Cada caso pode sobrescrever com o campo `hoje`.
#
# Convenções
#   intent             intenção que o classificador deve devolver
#                      (gasto | consulta_gasto | agenda | pessoa | confirmacao | fora_do_escopo)
#   espera.tool        PRIMEIRA ferramenta que o agente deve chamar
#   espera.args        argumentos que precisam bater exatamente; os não listados não são verificados
#   espera.args.payment_method  comparado DEPOIS da resolução pelos mesmos name/aliases da
#                      ferramenta (em total_fatura, só meios de crédito): "Itaú" ali vira "Itaú Crédito".
#   espera.contem      trechos de texto que só precisam aparecer (sem diferenciar maiúsculas e acentos).
#                      Em lancar_gasto, a chave `texto` é buscada em description + merchant.
#                      Em criar_evento, a chave `title` é buscada no título.
#   espera: pergunta        o agente NÃO chama ferramenta e faz uma pergunta de esclarecimento
#   espera: sem_ferramenta  o agente responde sem chamar ferramenta nenhuma
#   proibido           ferramentas que não podem ser chamadas nesse caso
#   historico          mensagens anteriores da conversa (para testar contexto)
#   pendente           ação aguardando confirmação no momento da mensagem
#   nota               explicação para quem mantém a prova
#
# Datas de evento em ISO 8601 com fuso (-03:00). Datas de gasto em AAAA-MM-DD.
# mes_vencimento = mês em que a fatura VENCE, no formato AAAA-MM.
# Ao carregar com PyYAML, datas sem aspas viram datetime.date: normalize tudo para
# string ISO antes de comparar com os argumentos devolvidos pelo modelo.
#
# Os cartões abaixo são FICTÍCIOS (o repositório é público); os reais ficam só no banco local.
# Têm a mesma forma do uso real: um crédito que fecha no último dia do mês (closing_day 31),
# outro crédito e um débito no mesmo banco desse outro. Casos de fatura estão marcados na nota.

fixtures:
  meios_pagamento:
    - {name: Nubank, kind: credito, closing_day: 31, due_day: 8}
    - {name: Itaú Crédito, kind: credito, closing_day: 25, due_day: 5}
    - {name: Itaú Débito, kind: debito}
    - {name: Pix, kind: pix}
    - {name: Dinheiro, kind: dinheiro}
  pessoas:
    - {name: Mariana, relation: irmã}
    - {name: Carlos, relation: chefe}
  categorias: [Alimentação, Mercado, Transporte, Casa, Saúde, Lazer, Educação, Assinaturas, Outros]

casos:

