    intent: agenda
    espera:
      tool: buscar_eventos
      args: {person: Carlos}
    proibido: [remover_evento]
    nota: "Busca primeiro; remoção sempre pede confirmação, nunca na primeira chamada."

  # ------------------------------------------------------------ CONFIRMAÇÃO (2)

  - id: k01
