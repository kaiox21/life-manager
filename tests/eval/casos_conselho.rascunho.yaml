# Rascunho dos casos da prova para o change conselheiro-financeiro (29/10/2026).
# NÃO é lido pelo executor: tests/eval/casos.yaml é somente leitura e estes casos só entram lá
# com a autorização do Kaio. Mesmas convenções e fixtures do casos.yaml (hoje = 2026-10-07).
# A importação de fatura em PDF não entra na prova: não passa pelo classificador nem escolhe
# ferramenta (é testada em tests/unit/test_statement*.py e no aceite com as faturas reais).

casos:

  # ---------------------------------------------------------------- CONSELHO (10)

  - id: c01
    msg: "posso comprar um fone de 400 em 4x no nubank?"
    intent: conselho
    espera:
      tool: avaliar_compra
      args: {amount_cents: 40000, installments: 4, payment_method: Nubank}

  - id: c02
    msg: "cabe no orçamento um tênis de 300 à vista no pix?"
    intent: conselho
    espera:
      tool: avaliar_compra
      args: {amount_cents: 30000, payment_method: Pix}

  - id: c03
    msg: "é seguro gastar 1200 numa bicicleta parcelando em 10 vezes no itaú?"
    intent: conselho
    espera:
      tool: avaliar_compra
      args: {amount_cents: 120000, installments: 10, payment_method: Itaú Crédito}
    nota: "parcelado no Itaú: só o crédito aceita parcelas"

  - id: c04
    msg: "vale a pena comprar a tv de 2500?"
    intent: conselho
    espera:
      tool: avaliar_compra
      args: {amount_cents: 250000}
    nota: "sem meio: avalia à vista no mês corrente; não precisa perguntar"

  - id: c05
    msg: "comprei um fone de 400 em 4x no nubank"
    intent: gasto
    espera:
      tool: lancar_gasto
      args: {amount_cents: 40000, installments: 4, payment_method: Nubank}
    proibido: [avaliar_compra]
    nota: "compra já feita é gasto, não conselho"

  - id: c06
    msg: "minha renda é 3.500 todo dia 5"
    intent: conselho
    espera:
      tool: gerenciar_renda
      args: {amount_cents: 350000, day: 5}

  - id: c07
    msg: "aluguel 900 todo dia 10"
    intent: conselho
    espera:
      tool: gerenciar_conta_fixa
      args: {amount_cents: 90000, day: 10}
      contem: {name: aluguel}
    nota: "conta fixa mensal, não um gasto de hoje"

  - id: c08
    msg: "tira a academia das contas fixas"
    intent: conselho
    espera:
      tool: gerenciar_conta_fixa
      args: {remover: true}
      contem: {name: academia}

  - id: c09
    msg: "posso gastar 200 no fim de semana?"
    intent: conselho
    espera:
      tool: avaliar_compra
      args: {amount_cents: 20000}

  - id: c10
    msg: "quanto gastei com mercado esse mês?"
    intent: consulta_gasto
    espera:
      tool: buscar_gastos
    proibido: [avaliar_compra]
    nota: "pergunta sobre o passado continua sendo consulta"
