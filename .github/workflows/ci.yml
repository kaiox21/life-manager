# Testes que rodam sem rede e sem LLM (a prova, `pytest -m eval`, custa dinheiro e fica fora).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nucleo:
    name: Núcleo (ruff + testes unitários)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: assistente_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d assistente_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5433/assistente_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit -q

  jarvis:
    name: Jarvis (cérebro, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra jarvis
      - run: uv run pytest tests/jarvis -q

  interface:
    name: Jarvis (interface)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis-ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
      - name: Especificações (OpenSpec)
        working-directory: .
        run: npx --yes @fission-ai/openspec@1.10.0 validate --all --strict
